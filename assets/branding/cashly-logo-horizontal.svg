<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="markBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1926" />
      <stop offset="100%" stop-color="#0e1724" />
    </linearGradient>

    <linearGradient id="markBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="markEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="40%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="markArrow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#a7f3d0" />
    </linearGradient>

    <filter id="markGlow">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Left: Icon Mark Container -->
  <g transform="translate(20, 20)">
    <!-- Squircle Background -->
    <rect x="0" y="0" width="200" height="200" rx="48" fill="url(#markBgGrad)" stroke="url(#markBorder)" stroke-width="2.5" />
    
    <!-- Mini Mark -->
    <g transform="translate(100, 100) scale(0.38) translate(-256, -256)">
      <!-- Outer Arc of 'C' -->
      <path d="M 330 155 C 305 132 270 120 230 120 C 152 120 90 182 90 260 C 90 338 152 400 230 400 C 295 400 350 355 365 295"
            fill="none"
            stroke="url(#markEmerald)"
            stroke-width="40"
            stroke-linecap="round"
            stroke-linejoin="round" />

      <!-- Inner Arrow Surge -->
      <path d="M 180 320 C 160 290 160 230 190 195 C 220 160 270 165 295 195 L 345 255 L 405 175"
            fill="none"
            stroke="url(#markArrow)"
            stroke-width="38"
            stroke-linecap="round"
            stroke-linejoin="round"
            filter="url(#markGlow)" />

      <!-- Arrowhead -->
      <polygon points="405,145 425,190 380,185" fill="#a7f3d0" />

      <!-- Sparkle -->
      <g transform="translate(390, 115) scale(0.8)">
        <path d="M0 -22 Q0 0 22 0 Q0 0 0 22 Q0 0 -22 0 Q0 0 0 -22 Z" fill="#ffffff" />
      </g>
    </g>
  </g>

  <!-- Right: Wordmark "Cashly" -->
  <g transform="translate(260, 125)">
    <!-- Main App Name -->
    <text x="0" y="15"
          font-family="system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Segoe UI', sans-serif"
          font-size="82"
          font-weight="900"
          letter-spacing="-1.5"
          fill="url(#textGrad)">Cashly</text>

    <!-- Emerald Dot Accent on the 'i' or at end -->
    <circle cx="282" cy="-44" r="7" fill="#34d399" filter="url(#markGlow)" />

    <!-- Subtitle / Tagline -->
    <text x="5" y="52"
          font-family="system-ui, -apple-system, 'SF Pro Text', 'Inter', 'Segoe UI', sans-serif"
          font-size="20"
          font-weight="600"
          letter-spacing="5"
          fill="#34d399">EXPENSE &amp; WEALTH TRACKER</text>
  </g>
</svg>
